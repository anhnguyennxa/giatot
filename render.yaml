# Render Blueprint: tạo API (Docker) + PostgreSQL + Redis (Key Value)
# Render Dashboard -> New -> Blueprint -> chọn repo này.
services:
  - type: web
    name: giatot-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: giatot-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: giatot-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL # ví dụ https://giatot.vercel.app
        sync: false
      - key: VNP_TMN_CODE
        sync: false
      - key: VNP_HASH_SECRET
        sync: false
      - key: VNP_URL
        value: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
      - key: VNP_RETURN_URL # ví dụ https://giatot.vercel.app/payment/vnpay-return
        sync: false
      - key: GHN_API_URL
        value: https://dev-online-gateway.ghn.vn/shiip/public-api
      - key: GHN_TOKEN
        sync: false
      - key: GHN_SHOP_ID
        sync: false

  - type: keyvalue
    name: giatot-redis
    plan: free
    region: singapore
    ipAllowList: [] # chỉ cho phép kết nối nội bộ trong Render

databases:
  - name: giatot-db
    plan: free
    region: singapore
    databaseName: giatot
    user: giatot
